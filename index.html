<style>
  :root {
    --forest: #042215;
    --ink: #141a18;
    --tagline: #2b3532;
    --mist-light: #f1f4f4;
    --mist-mid: #d6dddc;
    --mist-edge: #b9c4c1;
    --mist-shadow: rgba(40, 58, 52, 0.42);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background-color: var(--mist-mid);
    background-image:
      radial-gradient(ellipse 85% 34% at 50% 52%, var(--mist-shadow) 0%, rgba(80, 100, 94, 0.16) 55%, transparent 100%),
      radial-gradient(ellipse 90% 60% at 50% 22%, var(--mist-light) 0%, rgba(220, 227, 226, 0.7) 55%, transparent 100%),
      linear-gradient(180deg, var(--mist-mid) 0%, var(--mist-edge) 100%);
    background-repeat: no-repeat;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
  }

  header {
    padding-top: clamp(28px, 5vh, 44px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    display: block;
    box-shadow: 0 2px 10px rgba(4, 34, 21, 0.18);
  }

  .wordmark {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    text-transform: uppercase;
    color: var(--forest);
  }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px 8vh;
    text-align: center;
  }

  h1 {
    font-weight: 200;
    font-size: clamp(2rem, 7.2vw, 5.4rem);
    line-height: 1;
    letter-spacing: 0.28em;
    text-indent: 0.28em; /* offsets trailing letter-spacing so the text is truly centered */
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }

  .tagline {
    margin-top: clamp(16px, 2.6vh, 26px);
    max-width: 30ch;
    font-size: clamp(0.95rem, 1.6vw, 1.15rem);
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: 0.04em;
    color: var(--tagline);
  }

  /* One quiet entrance, skipped for people who prefer reduced motion */
  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
  }

  @media (max-width: 480px) {
    h1 { letter-spacing: 0.2em; text-indent: 0.2em; }
  }
</style>
</head>
